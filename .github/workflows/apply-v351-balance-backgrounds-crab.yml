name: Apply v3.51 Balance Backgrounds Crab

on:
  push:
    branches: [ main ]
    paths:
      - 'apply_v351_balance_backgrounds_crab.py'
      - '.github/workflows/apply-v351-balance-backgrounds-crab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v3.51 patch
        run: python apply_v351_balance_backgrounds_crab.py

      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/all-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          print('scripts',len(blocks))
          PY
          node --check /tmp/all-inline.js

      - name: Verify v3.51 markers
        run: |
          grep -q 'BATTLE <b>v3.51</b>' index.html
          grep -q "id:'crab'" index.html
          grep -q "id:'bg_desert'" index.html
          grep -q "id:'bg_casino'" index.html
          grep -q 'crabSkill(f,e,dt)' index.html
          grep -q 'crabVulnerableUntil' index.html
          grep -q 'doomInterval=f.doomInterval||8' index.html
          grep -q 'speed:230\*f.scale' index.html
          grep -q 'boss.hp=1500;boss.health=1500' index.html

      - name: Commit v3.51 index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.51 balance backgrounds and crab'
          git push