name: Apply v3.71
on:
  push:
    paths:
      - '.github/workflows/apply-v371.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.71 patch
        run: python apply_v371_doctor_rematch.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify v3.71 markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=[
            'BATTLE <b>v3.71</b>',
            "id:'doctor',name:'의사'",
            "damage:70,speed:145,cooldown:1",
            "this.attack(f,t,70*f.scale)",
            "Math.min(30*f.scale,t.hp-t.health)",
            "mode==='lab'?startLabStage(labStageNo):start()",
            "if(mode==='lab'){engine=null;mode='duel'}"
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing: '+repr(miss))
          bad=["this.attack(f,t,80*f.scale)","Math.min(50*f.scale,t.hp-t.health)"]
          present=[x for x in bad if x in s]
          if present: raise SystemExit('old doctor runtime remains: '+repr(present))
          print('v3.71 markers verified')
          PY
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.71'
          git push
