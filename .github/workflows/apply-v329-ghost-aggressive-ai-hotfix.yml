name: Apply NEON RUMBLE v3.29 Ghost Aggressive AI Hotfix
on:
  push:
    branches: [main]
    paths:
      - 'apply_v329_ghost_aggressive_ai_hotfix.py'
      - '.github/workflows/apply-v329-ghost-aggressive-ai-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hotfix
        run: python3 apply_v329_ghost_aggressive_ai_hotfix.py
      - name: Verify static integration
        run: |
          grep -q "f.id==='ghost'.*this.nearest(f)" index.html
          grep -q 'BATTLE <b>v3.29</b>' index.html
      - name: Syntax check scripts
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script>(.*?)</script>',s,re.S)):
              fn=f'/tmp/v329_ghost_ai_{i}.js'
              pathlib.Path(fn).write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',fn],check=True)
          print('V329_GHOST_AI_SYNTAX_OK')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Make Ghost AI aggressively chase enemies in v3.29'
            git push
          fi
