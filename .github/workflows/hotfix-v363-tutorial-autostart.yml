name: Hotfix v3.63 Tutorial Autostart
on:
  push:
    paths:
      - '.github/workflows/hotfix-v363-tutorial-autostart.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python apply_v363_tutorial_autostart_hotfix.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify tutorial autostart marker
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const KEY='neonRumble.tutorialSeen.v2';" in s
          assert "setTimeout(()=>openTutorial(false),80)" in s
          assert "if(reopen)reopen.onclick=()=>openTutorial(true)" in s
          print('tutorial autostart markers OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hotfix v3.63 tutorial autostart'
          git push
