name: Apply NEON RUMBLE v3.47 Detective and Infected UFO Balance

on:
  push:
    paths:
      - 'apply_v347_detective_infected_ufo_balance.py'
      - '.github/workflows/apply-v347-detective-infected-ufo-balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.47 patch
        run: python apply_v347_detective_infected_ufo_balance.py
      - name: Verify v3.47
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.47</b>',
            "id:'detective'",
            "unlock:'detective'",
            'DETECTIVE_UNLOCK_KEY',
            'Math.random()>=.03',
            "kind:'magnifier'",
            'damage:75*f.scale',
            'e.magnifiedUntil=this.time+2',
            '!e.boss',
            'hp:1250',
            'boss.hp=1500;boss.health=1500;boss.doomInterval=8;boss.doomNext=8',
            'const doomInterval=f.doomInterval||10',
            '감염 UFO가 8초마다 1초 피격 예고',
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('Missing v3.47 checks: '+repr(missing))
          # hidden acquisition chance must not be user-facing text
          visible_forbidden=['탐정 획득 확률 3%','탐정 획득 실패 (3%)','3% 보상 성공! 🕵️‍♂️']
          bad=[x for x in visible_forbidden if x in s]
          if bad: raise SystemExit('Detective chance leaked into UI: '+repr(bad))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/neon-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('v3.47 checks passed')
          PY
          node --check /tmp/neon-inline.js
      - name: Commit v3.47 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Release NEON RUMBLE v3.47 Detective and Infected UFO balance"
          git push
