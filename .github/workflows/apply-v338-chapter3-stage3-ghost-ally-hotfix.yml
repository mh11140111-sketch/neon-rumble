name: Apply NEON RUMBLE v3.38 Chapter 3 Stage 3 Ghost Ally Hotfix

on:
  push:
    paths:
      - 'apply_v338_chapter3_stage3_ghost_ally_hotfix.py'
      - '.github/workflows/apply-v338-chapter3-stage3-ghost-ally-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Stage 3 ghost ally hotfix
        run: python apply_v338_chapter3_stage3_ghost_ally_hotfix.py
      - name: Verify ghost ally hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.38</b>',
            'function spawnMansionGhost()',
            'tmp.hp=500;tmp.health=500',
            'spawnFemaleVampire();spawnMansionGhost()',
            "$('score-label0').textContent=n===3?'🧛 + 🧛‍♀️ + 👻':'🧛 흡혈귀 + 🧛‍♀️';",
            '여자 뱀파이어 HP 1000 + 유령 HP 500 지원',
            '🧛🧛‍♀️👻 VS 🧌',
          ]
          missing=[x for x in checks if x not in s]
          if missing:
            raise SystemExit('Missing ghost ally checks: '+repr(missing))
          print('v3.38 Stage 3 ghost ally checks passed')
          PY
      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/neon-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('inline scripts:',len(scripts))
          PY
          node --check /tmp/neon-inline.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hotfix Chapter 3 Stage 3 ghost ally in v3.38"
          git push
