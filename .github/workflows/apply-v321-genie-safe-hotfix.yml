name: Apply NEON RUMBLE v3.21 Genie Safe Hotfix
on:
  push:
    paths:
      - 'apply_v321_genie_safe_hotfix.py'
      - '.github/workflows/apply-v321-genie-safe-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe Genie hotfix
        run: python apply_v321_genie_safe_hotfix.py
      - name: Verify safe Genie hotfix
        run: |
          grep -Fq "BATTLE <b>v3.21</b>" index.html
          grep -Fq "ab2=abx*abx+aby*aby" index.html
          grep -Fq "ctx.lineCap='round'" index.html
          grep -Fq "ctx.ellipse" index.html && exit 1 || true
      - name: Commit safe Genie hotfix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild Genie arm safely in v3.21"
          git push
