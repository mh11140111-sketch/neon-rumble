name: Apply NEON RUMBLE v3.33

on:
  push:
    paths:
      - 'apply_v333.py'
      - '.github/workflows/apply-v333.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v3.33
        run: python apply_v333.py
      - name: Verify static integration
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.33</b>',
            "id:'coolguy'",
            'coolGuySkill(f,e)',
            'this.time-f.chefLastAttackAt>=8/f.scale-1e-9',
            "rate=stage===0?1:stage===1?.5:.8",
            "key='shout'",
            "ctx.fillText('🗣️',f.x,f.y+1)",
            "f.coolGuyNext=this.time+8/f.scale",
            "this.attack(f,target,150*f.scale)"
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          print('static checks passed')
          PY
      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('no scripts found')
          for i,js in enumerate(scripts):
            fd,path=tempfile.mkstemp(suffix=f'-{i}.js')
            os.close(fd)
            Path(path).write_text(js,encoding='utf-8')
            try: subprocess.run(['node','--check',path],check=True)
            finally: os.unlink(path)
          print('syntax checks passed:',len(scripts))
          PY
      - name: Commit v3.33
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.33'
          git push
