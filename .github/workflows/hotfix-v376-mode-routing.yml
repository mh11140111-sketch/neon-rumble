name: Hotfix v3.76 Mode Routing
on:
  push:
    paths:
      - '.github/workflows/hotfix-v376-mode-routing.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python hotfix_v376_mode_routing.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify mode routing hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=[
            "function createEngineForMode(activeMode)",
            "if(activeMode==='group')return new Engine",
            "if(activeMode==='relay')return new Engine",
            "if(activeMode==='boss'||activeMode==='boss-control')return new Engine",
            "if(activeMode==='control')return new Engine",
            "return new Engine(selected[0],selected[1],Math.random,{mode:'duel'})",
            "function verifyStartedMode(activeMode,battleEngine)",
            "activeMode==='group'",
            "battleEngine.mode==='duel'",
            "const activeMode=mode;engine=createEngineForMode(activeMode)",
            "NEON RUMBLE mode routing blocked",
            "settings.startPosition=['top','bottom','both'].includes(v)?v:'top'"
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing: '+repr(miss))
          if "engine=mode='group'?" in s: raise SystemExit('forced group assignment regression')
          if "engine=mode==='group'?new Engine" in s: raise SystemExit('old nested ternary routing still present')
          print('mode routing hardening verified')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hotfix v3.76 battle mode routing'
          git push
