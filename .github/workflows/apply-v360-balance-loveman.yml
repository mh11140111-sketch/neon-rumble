name: Apply v3.60 balance and Love Man
on:
  push:
    paths:
      - 'apply_v360_balance_loveman.py'
      - '.github/workflows/apply-v360-balance-loveman.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.60 patch
        run: python apply_v360_balance_loveman.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/neon-v360.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/neon-v360.js
      - name: Verify v3.60 markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.60</b>',
            "if(forgeWave>=3)engine.result=0",
            "this.attack(f,e,70*f.scale);f.cd=1/f.scale;this.effect(f,'🦈 물기 70','skill')",
            "id:'bg_forge'",
            "chapter:7,backgroundStyle:'forge'",
            "id:'loveman'",
            "loveManSkill(f,e)",
            "kind:'love_heal'",
            "kind==='love_charm'",
            "charmUntil",
            "💓 유혹 3초!"
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('Missing markers: '+repr(missing))
          print('v3.60 markers OK')
          PY
      - name: Commit and push release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.60 balance and Love Man' || exit 0
          git push
