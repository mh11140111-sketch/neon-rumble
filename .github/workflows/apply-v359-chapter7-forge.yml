name: Apply v3.59 Chapter 7 Forge
on:
  push:
    paths:
      - 'apply_v359_chapter7_forge.py'
      - '.github/workflows/apply-v359-chapter7-forge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.59 patch
        run: python3 apply_v359_chapter7_forge.py
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('no inline scripts')
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              p=Path(f'/tmp/v359_{i}.js');p.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('inline JS syntax OK')
          PY
      - name: Verify v3.59 markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.59</b>',
            "f.dragonRainUntil=this.time+7/f.scale",
            'nextCapture:10/scale',
            'f.nextCapture=this.time+10/f.scale',
            "id:'goblin'",
            "id:'goblin_king'",
            "FORGE_STAGE_KEY='neonRumble.forgeStages.v1'",
            'function chapter7Unlocked()',
            'id="chapter7-entry"',
            'id="forge-panel"',
            'function startForgeStage(n)',
            'function updateForgeStage()',
            "mode==='forge'",
            '왕도깨비 추가 보상',
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing markers: '+repr(missing))
          print('v3.59 markers OK')
          PY
      - name: Commit and push release
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.59 Chapter 7 Forge'
          git push
