name: Apply v3.48 Detective Rework

on:
  push:
    branches: [ main ]
    paths:
      - 'apply_v348_detective_rework.py'
      - '.github/workflows/apply-v348-detective-rework.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 apply_v348_detective_rework.py

      - name: Verify v3.48 markers
        run: |
          grep -q 'BATTLE <b>v3.48</b>' index.html
          grep -q 'v3.48 · 탐정 리워크' index.html
          grep -q 'detectiveJailSkill(f){' index.html
          grep -q 'jailPending' index.html
          grep -q '🚔 범인 잡기!' index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon-rumble-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('script blocks',len(blocks))
          PY
          node --check /tmp/neon-rumble-inline.js

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.48 Detective rework'
          git push
