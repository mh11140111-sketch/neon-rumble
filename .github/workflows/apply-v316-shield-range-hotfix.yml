name: Apply NEON RUMBLE v3.16 Shield Range Hotfix
on:
  push:
    paths:
      - 'apply_v316_shield_range_hotfix.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python apply_v316_shield_range_hotfix.py
      - name: Verify hotfix
        run: |
          grep -q "f.radius+55" index.html
          grep -q "const blocker=this.enemies(f).find(v=>v.id==='knight'" index.html
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hotfix knight charged shield range in v3.16"
          git push
