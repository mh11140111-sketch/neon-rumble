name: Apply v3.76 New Chapter 2
on:
  push:
    paths:
      - '.github/workflows/apply-v376-newchapter2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python apply_v376_newchapter2.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify v3.76 new chapter 2
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=[
            "HP +'+Math.round(heal)",
            "id='stage-jump-btn'",
            "bg_boxing","bg_lab","bg_hell",
            "item.chapter===8?(boxingStageMask&7)===7",
            "item.chapter===9?(labStageMask&7)===7",
            "item.chapter===10?(hellStageMask&7)===7",
            "NEW_CH2_STAGE_KEY='neonRumble.newChapter2Stages.v1'",
            "SKELE44_UNLOCK_KEY='neonRumble.skele44Unlocked.v1'",
            "id:'skeleton_king'",
            "id:'skele44'",
            "function newChapter2Unlocked(){return (newChapter1StageMask&7)===7}",
            "NEW-CHAPTER 2",
            "newChapter2Wave>=10",
            "hero.hp*.30",
            "b.hp=1500",
            "damage:50*f.scale",
            "this.random()<.30",
            "preDeathHp*2",
            "Math.random()>=.10",
            "mode==='newchapter2'",
            "updateNewChapter2Stage()"
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          # Preserve prior severe mode-routing hotfix.
          if "engine=mode='group'?" in s or "engine=mode==='group'?new Engine" in s:
              raise SystemExit('group routing regression')
          if "function createEngineForMode(activeMode)" not in s:
              raise SystemExit('mode routing hardening lost')
          # Preserve corrected grave code.
          if "deathisgood55:'graveFx'" not in s or "dathisgood55" in s:
              raise SystemExit('grave code regression')
          print('v3.76 new chapter 2 verified')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Patch NEON RUMBLE v3.76 NEW-CHAPTER 2'
          git push
