name: Apply NEON RUMBLE v3.15

on:
  push:
    branches: [main]
    paths:
      - 'apply_v315.py'
      - '.github/workflows/apply-v315.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.15 patch
        run: python apply_v315.py
      - name: Verify key v3.15 features
        run: |
          grep -q 'BATTLE <b>v3.15</b>' index.html
          grep -q "id:'puffer'" index.html
          grep -q 'const heal=Math.min(f.hp-f.health,Math.round(n\*f.lifesteal\*(f.id===' index.html
          grep -q "kind:'spike'" index.html
          grep -q 'tickToxin' index.html
          grep -q '맹독 3초' index.html
      - name: Commit v3.15
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Release NEON RUMBLE v3.15'
          git push
