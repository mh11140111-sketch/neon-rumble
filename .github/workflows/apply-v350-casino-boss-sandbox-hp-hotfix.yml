name: Apply v3.50 Casino Boss Sandbox HP Hotfix

on:
  push:
    branches: [ main ]
    paths:
      - 'apply_v350_casino_boss_sandbox_hp_hotfix.py'
      - '.github/workflows/apply-v350-casino-boss-sandbox-hp-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply hotfix
        run: python apply_v350_casino_boss_sandbox_hp_hotfix.py

      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/all-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          print('scripts',len(blocks))
          PY
          node --check /tmp/all-inline.js

      - name: Verify HP split
        run: |
          grep -q "id:'casino_boss'.*hp:800" index.html
          grep -q "boss.hp=1500;boss.health=1500" index.html
          grep -q 'BATTLE <b>v3.50</b>' index.html

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hotfix v3.50 casino boss sandbox HP 800"
          git push
