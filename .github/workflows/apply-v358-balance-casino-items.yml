name: Apply v3.58 balance and casino items

on:
  push:
    paths:
      - 'apply_v358_balance_casino_items.py'
      - '.github/workflows/apply-v358-balance-casino-items.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v3.58 patch
        run: python apply_v358_balance_casino_items.py
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('scripts',len(scripts))
          PY
          node --check /tmp/inline.js
      - name: Verify v3.58 markers
        run: |
          grep -F 'BATTLE <b>v3.58</b>' index.html
          grep -F "kind:'dragon_rain',icon:'💧',radius:8*f.scale,speed:520*f.scale,damage:5*f.scale" index.html
          grep -F "casino_clover" index.html
          grep -F "casino_star" index.html
          grep -F "casino_gold_medal" index.html
          grep -F "casino_silver_medal" index.html
          grep -F "casino_bronze_medal" index.html
      - name: Commit and push release
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.58'
          git push
