name: Apply NEON RUMBLE v3.28
on:
  push:
    branches: [main]
    paths:
      - 'apply_v328.py'
      - '.github/workflows/apply-v328.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v3.28
        run: python3 apply_v328.py
      - name: Verify v3.28 static integration
        run: |
          grep -q 'BATTLE <b>v3.28</b>' index.html
          grep -q "moonUltAt:35/scale" index.html
          grep -q "id:'lizard'" index.html
          grep -q "spawnLizardTail(owner)" index.html
          grep -q "boxerUppercut(f,e)" index.html
          grep -q "알라딘: 본체 AI" index.html
          grep -q "key='uppercut'" index.html
      - name: Syntax check scripts
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile, os
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          for i,b in enumerate(blocks):
              fn=f'/tmp/v328_{i}.js'
              pathlib.Path(fn).write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',fn],check=True)
          print('V328_SYNTAX_OK')
          PY
      - name: Commit v3.28
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Release NEON RUMBLE v3.28'
            git push
          fi
