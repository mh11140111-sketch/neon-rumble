name: Apply v3.48.1 Detective Freeze Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'apply_v3481_detective_freeze_fix.py'
      - '.github/workflows/apply-v3481-detective-freeze-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python apply_v3481_detective_freeze_fix.py
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/neon.js
      - name: Verify fix markers
        run: |
          grep -q "v3.48.1 · 탐정 먹통 버그 수정" index.html
          grep -q "Array.isArray(this.fighters)?this.fighters:\[\]" index.html
          ! grep -q "JAIL BARS v3.48" index.html
      - name: Commit fixed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hotfix NEON RUMBLE v3.48.1 Detective freeze" || exit 0
          git push
