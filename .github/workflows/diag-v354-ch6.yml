name: Diagnose v3.54 Chapter6
on:
  push:
    paths:
      - '.github/workflows/diag-v354-ch6.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show chapter/status/projectile code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          keys=['chapter5Unlocked','chapter5-entry','startCasinoStage','casinoStageMask','CASINO_STAGE_KEY','unlockCasino','casinoBossUnlocked','attackProjectile','dash','bleed','stunUntil','drawBackground','mode===\'casino\'','casino-select','ROSTER=[']
          for k in keys:
              print('\n===== '+k+' =====')
              start=0; found=0
              while True:
                  i=s.find(k,start)
                  if i<0: break
                  found+=1
                  print(s[max(0,i-1200):min(len(s),i+3200)])
                  start=i+len(k)
                  if found>=6: break
              if not found: print('(none)')
          PY
