name: Test v3.50 Casino Browser
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-v350-casino-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Serve game
        run: |
          python3 -m http.server 8123 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Test v3.50 runtime
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+(e.stack||e.message)));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'load'});
            await page.evaluate(()=>{
              localStorage.setItem('neonRumble.spaceStages.v1','7');
              localStorage.setItem('neonRumble.detectiveUnlocked.v1','1');
              localStorage.setItem('neonRumble.shopOwned.v1',JSON.stringify(['slotmachine']));
            });
            await page.reload({waitUntil:'load'});
            const chapter5=page.locator('#chapter5-entry');
            if(await chapter5.isDisabled()) throw new Error('Chapter 5 did not unlock with space stage mask 7');
            await chapter5.click();
            if(await page.locator('#casino-panel').isHidden())throw new Error('Casino panel hidden');
            await page.locator('#casino-1').click();
            await page.waitForTimeout(5500);
            if(await page.locator('#battle').isHidden())throw new Error('Casino stage 1 battle not visible');
            if(errors.length)throw new Error('Casino stage 1 runtime errors: '+JSON.stringify(errors));
            console.log('casino stage1 ok');

            await page.locator('#back').click();
            await page.locator('#chapter5-entry').click();
            await page.locator('#casino-3').click();
            await page.waitForTimeout(16500);
            if(await page.locator('#battle').isHidden())throw new Error('Casino stage 3 battle not visible');
            if(errors.length)throw new Error('Casino stage 3 runtime errors: '+JSON.stringify(errors));
            console.log('casino stage3 ok');

            await page.locator('#back').click();
            async function selectCharacter(name){
              const cards=page.locator('.fighter-card');
              for(let i=0;i<await cards.count();i++){
                const t=await cards.nth(i).innerText().catch(()=> '');
                if(t.includes(name)){await cards.nth(i).click();return true;}
              }
              return false;
            }
            if(!await selectCharacter('탐정'))throw new Error('Detective not found');
            await page.locator('#choose1').click();
            if(!await selectCharacter('대장장이'))throw new Error('Smith not found');
            await page.evaluate(()=>{Math.random=()=>0;});
            await page.locator('button.start').first().click();
            await page.waitForTimeout(13000);
            const resultHidden=await page.locator('#result').isHidden();
            if(resultHidden)throw new Error('Detective kill did not finish battle');
            if(errors.length)throw new Error('Detective runtime errors: '+JSON.stringify(errors));
            console.log('detective end-state ok');
            await browser.close();
            console.log('v3.50 browser runtime test passed');
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
