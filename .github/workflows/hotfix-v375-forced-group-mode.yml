name: Hotfix v3.75 Forced Group Mode
on:
  push:
    paths:
      - '.github/workflows/hotfix-v375-forced-group-mode.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python hotfix_v375_forced_group_mode.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify mode routing
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          must=[
            "engine=mode==='group'?new Engine(relayTeams[0][0],relayTeams[1][0],Math.random,{mode:'group',teams:relayTeams})",
            ":mode==='relay'?new Engine(relayTeams[0][0],relayTeams[1][0],Math.random,{mode:'relay',teams:relayTeams})",
            ":isBossMode()?new Engine(bossChoice,squad[0],Math.random,{mode:'boss',allies:squad})",
            ":mode==='control'?new Engine(selected[0],selected[1],Math.random,{mode:'control'})",
            ":new Engine(...selected)"
          ]
          miss=[x for x in must if x not in s]
          if miss: raise SystemExit('mode route missing: '+repr(miss))
          if "engine=mode='group'?" in s:
              raise SystemExit('forced group assignment remains')
          print('1v1 / group / relay / boss / control routing verified')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hotfix v3.75 forced 3v3 mode'
          git push
