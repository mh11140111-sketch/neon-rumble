name: Apply v3.50 Casino Chapter
on:
  push:
    branches: [ main ]
    paths:
      - 'apply_v350_casino_chapter.py'
      - '.github/workflows/apply-v350-casino-chapter.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v3.50 patch
        run: python apply_v350_casino_chapter.py
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/all-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          print('scripts',len(blocks))
          PY
          node --check /tmp/all-inline.js
      - name: Verify v3.50 markers
        run: |
          grep -q 'BATTLE <b>v3.50</b>' index.html
          grep -q "id:'casino_boss'" index.html
          grep -q 'function startCasinoStage(n)' index.html
          grep -q 'Math.random()>=.177' index.html
          grep -q 'casinoMoneyMax=7' index.html
          grep -q 'for(let i=0;i<7;i++)f.slotQueue.push' index.html
          grep -q 'Math.floor(this.rand(30,51))' index.html
          grep -q 'Math.floor(this.rand(25,31))' index.html
          grep -q 'updateCasinoStage();hud()' index.html
      - name: Commit v3.50 index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release NEON RUMBLE v3.50 Casino chapter'
          git push
