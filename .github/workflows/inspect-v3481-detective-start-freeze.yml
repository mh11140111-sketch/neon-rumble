name: Inspect v3.48.1 Detective Start Freeze
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-v3481-detective-start-freeze.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Detective update and draw context
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for key in ["if(f.id==='detective')", "detectiveJailSkill(f){", "function draw()", "JAIL BARS", "magnifier']"]:
              i=s.find(key)
              print('\n===',key,'@',i,'===')
              if i>=0: print(s[max(0,i-1200):i+2800])
          PY
