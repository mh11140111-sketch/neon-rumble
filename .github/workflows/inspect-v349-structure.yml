name: Inspect v3.49 Structure

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-v349-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          keys=[
            "id:'zombie_mage'",
            'zombie_mage',
            'detectiveJailSkill(f){',
            "s.kind==='magnifier'",
            'magnifiedUntil',
            'SHOP',
            'shop',
            'coin',
            'moneyman',
            'localStorage',
            'ROSTER=['
          ]
          seen=set()
          for key in keys:
            start=0
            count=0
            while True:
              i=s.find(key,start)
              if i<0: break
              sig=(key,i)
              if sig not in seen:
                seen.add(sig)
                print('\n===',key,'@',i,'===')
                print(s[max(0,i-1200):i+3400])
              count+=1
              start=i+1
              if count>=4: break
          PY
