name: Apply NEON RUMBLE v3.32

on:
  push:
    paths:
      - 'apply_v332.py'
      - '.github/workflows/apply-v332.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v3.32
        run: python apply_v332.py
      - name: Verify static integration
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.32</b>',
            "id:'chef'",
            'chefPanTip(f){',
            'chefSkill(f){',
            "chefEggReady:type.id==='chef'",
            'f.chefEggReadyAt=this.time+2/f.scale',
            'this.time-f.chefLastAttackAt>=5/f.scale',
            'dmg=(egg?90:65)*f.scale',
            'this.applyBurn(f,pan.enemy)'
          ]
          for c in checks: assert c in s,c
          print('static verification passed')
          PY
      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/neon-v332.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/neon-v332.js
      - name: Commit v3.32
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Release NEON RUMBLE v3.32'
            git push
          fi
