name: Apply v3.76
on:
  push:
    paths:
      - '.github/workflows/apply-v376.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.76 patch
        run: python apply_v376_devil_codes.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify v3.76
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=[
            'BATTLE <b>v3.76</b>',
            "lovehate85:'loveSkin'",
            "darkmoon135:'moonSkin'",
            "dathisgood55:'graveFx'",
            "id:'skin_loveman_kiss'",
            "icon:'😘'",
            "id:'skin_moon_newmoon'",
            "icon:'🌚'",
            "GRAVE_FX_KEY='neonRumble.graveFxUnlocked.v1'",
            "ctx.fillText('༼☠︎༽'",
            "if(r<.008)",
            "else if(r<.023)",
            "else if(r<.199)",
            "사랑과 미움은 생각보다 가까이 붙어 있지."
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing: '+repr(miss))
          # v3.75 forced-group hotfix must remain intact
          if "engine=mode='group'?" in s: raise SystemExit('forced group regression')
          if "engine=mode==='group'?" not in s: raise SystemExit('group routing missing')
          # Old secret features must remain.
          for x in ["itisme13666:'demon'","ninja4:'ninjaSkin'","fast8282:'fastSpeed'","lucky777:'coinBoost'"]:
              if x not in s: raise SystemExit('existing secret lost: '+x)
          # Secret strings must not appear in newest patch note block.
          patch=s.split('</details>',1)[0]
          for secret in ['lovehate85','darkmoon135','dathisgood55','itisme13666','what?','fight787','lucky777']:
              if secret in patch: raise SystemExit('secret leaked in patch notes: '+secret)
          print('v3.76 verified')
          PY
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.76'
          git push
