name: Apply v3.53 Crab Tutorial
on:
  push:
    paths:
      - 'apply_v353_crab_tutorial.py'
      - '.github/workflows/apply-v353-crab-tutorial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.53 patch
        run: python3 apply_v353_crab_tutorial.py
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,x in enumerate(scripts):
              Path(f'/tmp/script{i}.js').write_text(x,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/script*.js; do node --check "$f"; done
      - name: Verify v3.53 markers
        run: |
          grep -q 'BATTLE <b>v3.53</b>' index.html
          grep -q 'f.speed\*=1.2;f.crabVulnerableUntil' index.html
          grep -q 'id="tutorial-overlay"' index.html
          grep -q 'id="tutorial-reopen"' index.html
          grep -q 'neonRumble.tutorialSeen.v1' index.html
      - name: Commit v3.53 index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release NEON RUMBLE v3.53 crab speed and tutorial'
          git push