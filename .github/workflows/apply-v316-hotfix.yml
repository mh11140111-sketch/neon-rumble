name: Apply NEON RUMBLE v3.16 Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'apply_v316_hotfix.py'
      - '.github/workflows/apply-v316-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.16 hotfix
        run: python apply_v316_hotfix.py
      - name: Verify hotfix
        run: |
          grep -q 'BATTLE <b>v3.16</b>' index.html
          grep -q "this.emit('🛡️ 방패 충격파!')" index.html
          grep -q 'const n=Math.min(e.health,100)' index.html
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Hotfix knight shockwave freeze in v3.16'
          git push
