name: Apply NEON RUMBLE v3.34

on:
  push:
    paths:
      - 'apply_v334.py'
      - '.github/workflows/apply-v334.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v3.34
        run: python apply_v334.py
      - name: Verify static integration
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.34</b>',
            "id:'skeleton_gun'",
            "id:'skeleton_sword'",
            "id:'skeleton_drunk'",
            "id:'skeleton_mage'",
            'function startDesertStage(n)',
            'function updateDesertStage()',
            "this.attack(f,target,200*f.scale)",
            "ROBOT_STAGE_KEY='neonRumble.robotStages.v1'",
            "SKELETON_UNLOCK_KEY='neonRumble.skeletonUnlocked.v1'",
            'desertWave>=5',
            'desertNextMageSummon+=10',
            "f.revivals=(f.revivals||0)+1"
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          print('static checks passed')
          PY
      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('no scripts found')
          for i,js in enumerate(scripts):
            fd,path=tempfile.mkstemp(suffix=f'-{i}.js')
            os.close(fd)
            Path(path).write_text(js,encoding='utf-8')
            try: subprocess.run(['node','--check',path],check=True)
            finally: os.unlink(path)
          print('syntax checks passed:',len(scripts))
          PY
      - name: Commit v3.34
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.34'
          git push
