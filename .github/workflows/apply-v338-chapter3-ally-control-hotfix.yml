name: Apply NEON RUMBLE v3.38 Chapter 3 Ally Hotfix

on:
  push:
    paths:
      - 'apply_v338_chapter3_ally_control_hotfix.py'
      - '.github/workflows/apply-v338-chapter3-ally-control-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.38 ally hotfix
        run: python apply_v338_chapter3_ally_control_hotfix.py
      - name: Verify ally control separation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            "this.mansionMode&&f.summon",
            "engine.desertWaveMode=true;engine.mansionMode=true",
            "BATTLE <b>v3.38</b>",
            "function startMansionStage(n)",
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('Missing ally hotfix checks: '+repr(missing))
          print('ally control hotfix checks passed')
          PY
      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/neon-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/neon-inline.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Chapter 3 female Vampire ally control in v3.38"
          git push
