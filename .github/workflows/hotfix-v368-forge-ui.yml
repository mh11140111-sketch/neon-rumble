name: Hotfix v3.68 Forge UI
on:
  push:
    paths:
      - '.github/workflows/hotfix-v368-forge-ui.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply forge UI runtime hotfix
        run: python hotfix_v368_forge_ui_name.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          assert 'updateForgeSystemUI()' not in s
          assert 'renderForgeSystem()' in s
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hotfix v3.68 forge UI refresh'
          git push
