name: Apply NEON RUMBLE v3.20 Genie Hotfix
on:
  push:
    paths:
      - 'apply_v320_genie_hotfix.py'
      - '.github/workflows/apply-v320-genie-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply genie hotfix
        run: python apply_v320_genie_hotfix.py
      - name: Verify genie hotfix
        run: |
          grep -Fq "BATTLE <b>v3.20</b>" index.html
          grep -Fq "armor:0,lifesteal:0,rootSlowStrength:0,magicSlowStrength:0,speed:180*scale" index.html
          grep -Fq "'robot','genie'].includes(f.id)" index.html
          grep -Fq "🧞‍♂️ 지니 '+ghp+' / '+gmax+' HP" index.html
          grep -Fq "allFs.filter(f=>!f.summon)" index.html
      - name: Commit genie hotfix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hotfix Genie combat in v3.20"
          git push
