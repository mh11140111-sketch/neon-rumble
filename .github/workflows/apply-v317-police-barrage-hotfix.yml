name: Apply NEON RUMBLE v3.17 Police Barrage Hotfix
on:
  push:
    paths:
      - 'apply_v317_police_barrage_hotfix.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply police barrage hotfix
        run: python apply_v317_police_barrage_hotfix.py
      - name: Verify police barrage hotfix
        run: |
          grep -Fq "f.policeBarrageCd=this.time+.38/f.scale" index.html
          grep -Fq "const a=this.random()*Math.PI*2" index.html
          grep -Fq "bounces:0" index.html
          grep -Fq 'BATTLE <b>v3.17</b>' index.html
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hotfix police barrage in v3.17'
          git push
