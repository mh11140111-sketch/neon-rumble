name: Test v3.54 Browser
on:
  push:
    paths:
      - '.github/workflows/test-v354-browser.yml'
  workflow_dispatch:
jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Serve game
        run: |
          python3 -m http.server 8123 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Test Chapter 6 runtime
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:900},hasTouch:true,isMobile:true});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+(e.stack||e.message)));
            await page.addInitScript(()=>{
              localStorage.setItem('neonRumble.tutorialSeen.v1','1');
              localStorage.setItem('neonRumble.casinoStages.v1','7');
            });
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'load'});
            if(!(await page.locator('body').innerText()).includes('v3.54')) throw new Error('v3.54 missing');
            const c6=page.locator('#chapter6-entry');
            if(await c6.isDisabled()) throw new Error('chapter6 did not unlock from casinoStages=7');
            await c6.click();
            if(await page.locator('#ocean-panel').isHidden()) throw new Error('ocean panel hidden');
            await page.locator('#ocean-1').click();
            await page.waitForTimeout(1400);
            if(!(await page.locator('#battle-mode').innerText()).includes('OCEAN 1')) throw new Error('ocean stage1 did not start');
            console.log('stage1 started');
            await page.locator('#back').click();
            await page.locator('#chapter6-entry').click();
            await page.locator('#ocean-2').click();
            await page.waitForTimeout(4200);
            if(!(await page.locator('#battle-info').innerText()).includes('출혈')) throw new Error('stage2 info missing bleed');
            console.log('stage2 shark runtime ok');
            await page.locator('#back').click();
            await page.locator('#chapter6-entry').click();
            await page.locator('#ocean-3').click();
            await page.waitForTimeout(3600);
            if(!(await page.locator('#battle-info').innerText()).includes('파도')) throw new Error('stage3 info missing wave');
            if(errors.length) throw new Error('runtime errors: '+JSON.stringify(errors));
            console.log('stage3 merman runtime ok');
            console.log('v3.54 browser test passed');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
