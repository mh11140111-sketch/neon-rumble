name: Apply NEON RUMBLE v3.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v312.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v3.12 patch
        run: python apply_v312.py
      - name: Commit v3.12
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Release NEON RUMBLE v3.12"
          git push
