name: Apply NEON RUMBLE v3.14

on:
  push:
    branches: [main]
    paths:
      - 'apply_v314_fix.py'
      - '.github/workflows/apply-v314.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.14 patch
        run: python apply_v314_fix.py
      - name: Verify key v3.14 features
        run: |
          grep -q 'BATTLE <b>v3.14</b>' index.html
          grep -q "id:'moai'" index.html
          grep -q "mode==='group'" index.html
          grep -q 'character-search' index.html
          grep -q 'const reflected=50' index.html
          grep -q 'moonUltAt:35/scale' index.html
      - name: Commit v3.14
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Release NEON RUMBLE v3.14'
          git push
