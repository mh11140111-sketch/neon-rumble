name: Apply NEON RUMBLE v3.36 Finalize

on:
  push:
    paths:
      - 'apply_v336_finalize.py'
      - '.github/workflows/apply-v336-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.36 finalization
        run: python apply_v336_finalize.py
      - name: Verify v3.36 integration
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '<b>v3.36</b>',
            '📒 패치노트 · v3.36',
            'v3.36 · 그림자의 분신, 사막 군단의 재편',
            "hp:800,damage:100,speed:150,cooldown:1",
            "const side=this.fighters.length,hp=150,a=this.rand(-Math.PI,Math.PI),c=",
            "f.cd=2/f.scale;f.attack=.16/f.scale",
            "f.cd=1.5/f.scale;f.attack=.18/f.scale",
            "bodyScale=(boss?(skeletonBundle?1.5:3):1)",
            'spawnSkeletonBundleMates(owner)',
            "heroAuto=f.id==='hero'&&f.heroReady",
            'updateNinjaClone(f)',
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          forbidden=['카우보이 기본 체력 1000 → 750','HP 750 · 말 탑승']
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('stale v3.36 data: '+repr(bad))
          print('v3.36 static integration checks passed')
          PY
      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,code in enumerate(scripts):
            if not code.strip(): continue
            f=Path(tempfile.gettempdir())/f'neon_rumble_v336_finalize_{i}.js'
            f.write_text(code,encoding='utf-8')
            subprocess.run(['node','--check',str(f)],check=True)
          print('node syntax checks passed')
          PY
      - name: Commit v3.36 final release
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finalize NEON RUMBLE v3.36'
          git push
