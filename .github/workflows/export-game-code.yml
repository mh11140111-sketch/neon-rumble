name: Export NEON RUMBLE Game Code

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-game-code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify v3.47
        run: grep -q 'BATTLE <b>v3.47</b>' index.html
      - name: Rename game code
        run: cp index.html NEON_RUMBLE_v3.47_GAME_CODE.html
      - name: Upload game code
        uses: actions/upload-artifact@v4
        with:
          name: NEON_RUMBLE_v3.47_GAME_CODE
          path: NEON_RUMBLE_v3.47_GAME_CODE.html
          if-no-files-found: error
          retention-days: 30
