name: Apply NEON RUMBLE v3.38 Chapter 3 Stage 2 Zombie Heal Hotfix

on:
  push:
    paths:
      - 'apply_v338_chapter3_stage2_zombie_heal_hotfix.py'
      - '.github/workflows/apply-v338-chapter3-stage2-zombie-heal-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Stage 2 zombie heal hotfix
        run: python apply_v338_chapter3_stage2_zombie_heal_hotfix.py
      - name: Verify hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.38</b>',
            'mansionStage2HealRewarded',
            'heal=ally.hp*.05',
            '🧟‍♂️ 소환 좀비 처치! 모든 아군 최대 HP 5% 회복',
            '소환 좀비 처치 시 모든 아군 최대 HP 5% 회복',
          ]
          missing=[x for x in checks if x not in s]
          if missing:
            raise SystemExit('Missing Stage 2 zombie heal checks: '+repr(missing))
          print('v3.38 Stage 2 zombie heal hotfix checks passed')
          PY
      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/neon-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('inline scripts:',len(scripts))
          PY
          node --check /tmp/neon-inline.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hotfix Chapter 3 Stage 2 summoned zombie heal in v3.38"
          git push
