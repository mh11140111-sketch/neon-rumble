name: Apply v3.62 Sun
on:
  push:
    paths:
      - '.github/workflows/apply-v362-sun.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python apply_v362_sun.py
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/neon.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.62 Sun'
          git push
