name: Apply NEON RUMBLE v3.25 Hand Persistence Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'apply_v325_hand_persist_hotfix.py'
      - 'debug_v325_hand_persist.mjs'
      - '.github/workflows/apply-v325-hand-persist-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hand persistence hotfix
        run: python apply_v325_hand_persist_hotfix.py
      - name: Verify static integration
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'BATTLE <b>v3.25</b>',
            'spawnCursedHand(owner,near=null,persistent=false)',
            'persistentHand:persistent',
            'expiresAt:persistent?Infinity:this.time+5',
            "this.spawnCursedHand(f,f,true)",
            '본체 손 소환 13초마다 / 무한 유지',
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          print('HAND_PERSIST_STATIC_OK')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install runtime test dependency
        run: npm install --no-save jsdom@24
      - name: Run hand persistence runtime diagnostic
        run: node debug_v325_hand_persist.mjs
      - name: Run v3.25 regression
        run: node debug_v325.mjs
      - name: Run stage regression
        run: node debug_v324_stage.mjs
      - name: Run controlled boss regression
        run: node debug_v324_control_boss.mjs
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep Devil Eye body summons permanently in v3.25'
          git push
