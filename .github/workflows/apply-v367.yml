name: Apply v3.67
on:
  push:
    paths:
      - '.github/workflows/apply-v367.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.67 snail submarine hotfix
        run: python hotfix_v367_snail_contact_chase.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify v3.67 snail submarine markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=[
            'BATTLE <b>v3.67</b>',
            "id:'snail',name:'달팽이'",
            'damage:6767676767',
            'speed:28,cooldown:1',
            'snailContactSide:null,snailContactTime:0',
            'f.snailContactTime>=.3',
            "'psychic','snail'].includes(f.id)"
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing: '+repr(miss))
          if 'BATTLE <b>v3.68</b>' in s: raise SystemExit('version changed unexpectedly')
          print('v3.67 snail submarine markers verified')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hotfix v3.67 snail chase contact timing'
          git push
