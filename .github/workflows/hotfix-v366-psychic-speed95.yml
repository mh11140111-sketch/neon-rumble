name: Hotfix v3.66 Psychic Speed 95
on:
  push:
    paths:
      - '.github/workflows/hotfix-v366-psychic-speed95.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python hotfix_v366_psychic_speed95.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify speed 95 only
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=["BATTLE <b>v3.66</b>","damage:50,speed:95,cooldown:2,unlock:'psychic'","damage:50*f.scale","80*f.scale"]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing: '+repr(miss))
          print('v3.66 psychic speed 95 verified')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hotfix v3.66 psychic speed 95'
          git push
