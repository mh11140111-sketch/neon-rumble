name: Apply NEON RUMBLE v3.27 Impact Sound Hotfix
on:
  push:
    paths:
      - 'apply_v327_impact_sound_hotfix.py'
      - '.github/workflows/apply-v327-impact-sound-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python apply_v327_impact_sound_hotfix.py
      - name: Verify impact sound
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "function playImpactSfx()" in s
          assert "thud.frequency.exponentialRampToValueAtTime(52" in s
          assert "filter.type='lowpass'" in s
          assert "else if(kind==='hit'){playImpactSfx()}" in s
          assert "BATTLE <b>v3.27</b>" in s
          print('V327_IMPACT_SOUND_OK')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve impact sound in v3.27"
          git push
