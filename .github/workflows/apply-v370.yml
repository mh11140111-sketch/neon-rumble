name: Apply v3.70
on:
  push:
    paths:
      - '.github/workflows/apply-v370.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix helper anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_v370_lab_doctor.py')
          s=p.read_text(encoding='utf-8')
          old="once(\"'ocean','forge','boxing'].includes(mode)\", \"'ocean','forge','boxing','lab'].includes(mode)\", 'manual lab mode')"
          new="once(\"function isManualMode(){return ['control','stage','boss-control','desert','mansion','space','casino','ocean','forge','boxing'].includes(mode)}\", \"function isManualMode(){return ['control','stage','boss-control','desert','mansion','space','casino','ocean','forge','boxing','lab'].includes(mode)}\", 'manual lab mode')"
          if old not in s: raise SystemExit('manual helper line missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply v3.70 patch
        run: python apply_v370_lab_doctor.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify v3.70 markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=[
            'BATTLE <b>v3.70</b>',
            "id:'furball',name:'털복숭이'",
            "cooldown:.95",
            'baseHp*2.5',
            'furballBonusDamage',
            'f.oldTvNoiseUntil=this.time+1.5/f.scale',
            "id:'scientist',name:'과학자'",
            "id:'doctor',name:'의사'",
            'scientistSkill(f,e)',
            'doctorSkill(f)',
            'tickDrugTreatment(f)',
            "chapter9-entry",
            'CHAPTER 9',
            'spawnLabWave()',
            "Math.random()>=.10"
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing: '+repr(miss))
          print('v3.70 markers verified')
          PY
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.70'
          git push
