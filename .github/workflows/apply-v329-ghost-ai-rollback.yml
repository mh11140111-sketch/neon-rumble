name: Apply NEON RUMBLE v3.29 Ghost AI Rollback

on:
  push:
    paths:
      - 'apply_v329_ghost_ai_rollback.py'
      - '.github/workflows/apply-v329-ghost-ai-rollback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply rollback
        run: python3 apply_v329_ghost_ai_rollback.py
      - name: Verify rollback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "this.attack(g,e,15*g.scale)" in s
          assert "ghost.ghostPossessing=true" in s
          assert "BATTLE <b>v3.29</b>" in s
          assert "if(f.id==='ghost'&&f.health>0&&f.stunUntil<=this.time&&!f.ghostPossessing)" not in s
          print('ROLLBACK_VERIFY_OK')
          PY
      - name: Syntax check scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          for i,b in enumerate(blocks):
              p=Path(f'/tmp/nr_script_{i}.js');p.write_text(b,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  raise SystemExit(r.stderr)
          print('JS_SYNTAX_OK')
          PY
      - name: Commit rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rollback Ghost AI to default movement in v3.29'
          git push
