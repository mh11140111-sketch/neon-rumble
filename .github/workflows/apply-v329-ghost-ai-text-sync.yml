name: Apply NEON RUMBLE v3.29 Ghost AI Text Sync

on:
  push:
    paths:
      - 'apply_v329_ghost_ai_text_sync.py'
      - '.github/workflows/apply-v329-ghost-ai-text-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply text sync
        run: python3 apply_v329_ghost_ai_text_sync.py
      - name: Verify text sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "일반 이동 AI" in s
          assert "this.attack(g,e,15*g.scale)" in s
          assert "if(f.id==='ghost'&&f.health>0&&f.stunUntil<=this.time&&!f.ghostPossessing)" not in s
          assert "BATTLE <b>v3.29</b>" in s
          print('TEXT_SYNC_VERIFY_OK')
          PY
      - name: Commit text sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync Ghost description after AI rollback in v3.29'
          git push
