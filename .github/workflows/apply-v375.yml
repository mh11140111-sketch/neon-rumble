name: Apply v3.75
on:
  push:
    paths:
      - '.github/workflows/apply-v375.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.75 patch
        run: python apply_v375_doctor_codes_boost.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/neon.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/neon.js'],check=True)
          PY
      - name: Verify v3.75 features
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          req=[
            'BATTLE <b>v3.75</b>',
            "this.random()<.75",
            "this.applyToxin(f,t)",
            "'what?':'demonSkin'",
            "fight787:'boxerSkin'",
            "lucky777:'coinBoost'",
            "id:'skin_demon_mark'",
            "icon:'𖤍'",
            "id:'skin_boxer_master'",
            "icon:'🫡'",
            "COIN_BOOST_TICKET_KEY='neonRumble.coinBoostTickets.v1'",
            "COIN_BOOST_UNTIL_KEY='neonRumble.coinBoostUntil.v1'",
            "coinBoostUntil=Date.now()+10*60*1000",
            "base*(coinBoostActive()?2:1)",
            "else if(r<.85){casinoShowReels('🎟️')",
            "코인 2배 획득권 15%, 꽝 15%",
            "r<.003",
            "r<.009",
            "r<.017",
            "r<.027"
          ]
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('missing: '+repr(miss))
          # Existing v3.74 secret-speed unlock must survive.
          for x in ["fast8282:'fastSpeed'",'<option value="5" data-secret-speed disabled>','<option value="10" data-secret-speed disabled>']:
              if x not in s: raise SystemExit('existing secret speed feature lost: '+x)
          # Secret strings must not be leaked into patch notes.
          patch=s.split('</details>',1)[0]
          for secret in ['what?','fight787','lucky777','itisme13666','ninja4','fast8282','skip82','neon67']:
              if secret in patch: raise SystemExit('secret leaked in patch notes: '+secret)
          print('v3.75 verified')
          PY
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release NEON RUMBLE v3.75'
          git push
