name: Debug NEON RUMBLE v3.21 Genie
on:
  push:
    paths:
      - '.github/workflows/debug-v321-genie.yml'
      - 'debug_v321_genie.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y
      - run: npm install jsdom@24
      - run: node debug_v321_genie.mjs
